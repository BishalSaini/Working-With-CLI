version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.17  # Use a Node.js Docker image
    steps:
      - checkout  # Check out the code from the repository
      - run:
          name: Install Dependencies
          command: npm install  # Install dependencies
      - run:
          name: Run Tests
          command: npm test  # Run tests (assuming you have a test script in package.json)

workflows:
  version: 2.1
  build-and-test:
    jobs:
      - build
